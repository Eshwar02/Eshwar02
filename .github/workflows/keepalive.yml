name: Keepalive

# GitHub auto-disables scheduled workflows after 60 days of repo inactivity.
# This bumps activity weekly so the snake cron never gets disabled.

on:
  schedule:
    # 30 0 * * 1 UTC = 06:00 AM IST every Monday
    - cron: "30 0 * * 1"
  workflow_dispatch: {}

jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/keepalive-workflow@v2
